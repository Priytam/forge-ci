stages: [build, test, deploy]
jobs:
  build-app:
    stage: build
    script:
      - echo "compiling..."
      - sleep 2
      - echo "build done"
  unit-tests:
    stage: test
    script:
      - echo "running unit tests"
      - sleep 2
      - echo "all 42 tests passed"
  lint:
    stage: test
    script:
      - echo "linting"
      - echo "no issues"
  deploy-dev:
    stage: deploy
    except: [main]        # dev DAG: any non-main ref deploys to dev, no gate
    script:
      - echo "deploying to DEV"
      - echo "done"
  deploy-prod:
    stage: deploy
    only: [main]          # prod DAG: main only, behind the approval gate
    environment: production
    script:
      - echo "deploying to production"
      - sleep 1
      - echo "deployed"
