{{- if .Values.server.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge-ci.server.serviceAccountName" . }}
  labels:
    {{- include "forge-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.runner.enabled .Values.runner.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "forge-ci.runner.serviceAccountName" . }}
  {{- if eq .Values.runner.mode "kubernetes" }}
  namespace: {{ include "forge-ci.runner.kubeNamespace" . }}
  {{- end }}
  labels:
    {{- include "forge-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with .Values.runner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/* In kubernetes mode the runner uses the SA token in-cluster to drive job pods. */}}
automountServiceAccountToken: {{ eq .Values.runner.mode "kubernetes" }}
{{- end }}
