{{/*
Sensitive env for forge-server (and the runner token). Skipped entirely when
secrets.existingSecret is set — the operator supplies these keys (FORGE_SECRET_KEY,
DATABASE_URL, S3_SECRET_KEY, RUNNER_TOKEN, WEBHOOK_SECRET, REDIS_URL) in their own
Secret, e.g. via External Secrets / Vault / SealedSecrets.

Empty values are safe: the server treats an empty FORGE_SECRET_KEY as plaintext
passthrough, an empty WEBHOOK_SECRET / RUNNER_TOKEN as "disabled", and an empty
REDIS_URL as "use the postgres log backend".
*/}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge-ci.secretName" . }}
  labels:
    {{- include "forge-ci.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "forge-ci.databaseUrl" . | quote }}
  REDIS_URL: {{ include "forge-ci.redisUrl" . | quote }}
  FORGE_SECRET_KEY: {{ .Values.secrets.forgeSecretKey | quote }}
  RUNNER_TOKEN: {{ .Values.secrets.runnerToken | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  {{- if eq .Values.config.artifacts.store "s3" }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  {{- end }}
{{- end }}
