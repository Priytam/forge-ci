{{/*
Namespaced RBAC for the kubernetes executor. Rendered ONLY when
runner.mode=kubernetes and runner.rbac.create. Grants exactly what the
executor issues: pod create/get/list/watch/delete, pods/exec create
(kubectl exec AND kubectl cp), pods/log get (kubectl wait diagnostics).
Nothing cluster-scoped. See docs/kubernetes-deployment.md.
*/}}
{{- if and .Values.runner.enabled (eq .Values.runner.mode "kubernetes") .Values.runner.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "forge-ci.runner.fullname" . }}
  namespace: {{ include "forge-ci.runner.kubeNamespace" . }}
  labels:
    {{- include "forge-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "forge-ci.runner.fullname" . }}
  namespace: {{ include "forge-ci.runner.kubeNamespace" . }}
  labels:
    {{- include "forge-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "forge-ci.runner.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "forge-ci.runner.serviceAccountName" . }}
    namespace: {{ include "forge-ci.runner.kubeNamespace" . }}
{{- if .Values.runner.limitRange.enabled }}
---
{{/* Optional namespace LimitRange so runaway job pods can't starve the cluster. */}}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "forge-ci.runner.fullname" . }}-job-defaults
  namespace: {{ include "forge-ci.runner.kubeNamespace" . }}
  labels:
    {{- include "forge-ci.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  limits:
    - type: Container
      default:
        {{- toYaml .Values.runner.limitRange.default | nindent 8 }}
      defaultRequest:
        {{- toYaml .Values.runner.limitRange.defaultRequest | nindent 8 }}
{{- end }}
{{- end }}
